name: Build Star Dodger IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: pocket-arcade-4

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm first, bypassing standard npm engine bugs entirely
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pocket-arcade-4/package.json

      # Clean, isolated installation that skips bad local config redirections
      - name: Install JS deps
        run: pnpm install --no-frozen-lockfile

      # Sync web assets using npx or pnpm exec
      - name: Sync Capacitor web assets
        run: pnpm exec cap sync ios

      # Build unsigned native iOS app package
      - name: Build unsigned .app for device
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -R App.app Payload/App.app
          zip -r StarDodger.ipa Payload
          mv StarDodger.ipa $GITHUB_WORKSPACE/StarDodger.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarDodger-ipa
          path: StarDodger.ipa

