name: Build Star Dodger IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: pocket-arcade-4

# Force the entire runner container environment to point to the correct API endpoint globally
env:
  NPM_CONFIG_REGISTRY: https://npmjs.org

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Explicit clean out of conflicting local workspace configuration footprints
      - name: Sanitize Environment Files
        run: rm -f .npmrc ~/.npmrc

      - name: Generate Complete Lockfile
        run: npm install --package-lock-only

      - name: Install JS deps
        run: npm ci

      # Sync web assets to the native runtime wrapper
      - name: Sync Capacitor web assets
        run: npx cap sync ios

      - name: Build unsigned .app for device
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package as IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -R App.app Payload/App.app
          zip -r StarDodger.ipa Payload
          mv StarDodger.ipa $GITHUB_WORKSPACE/StarDodger.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarDodger-ipa
          path: StarDodger.ipa

