<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Pocket Arcade</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="backBtn" class="hidden">◀ BACK</button>
      <h1 id="topTitle">POCKET ARCADE</h1>
      <span id="topSpacer"></span>
    </header>

    <div id="home" class="screen">
      <div class="shelf-label">CARTRIDGE SHELF — 6 TITLES</div>
      <div class="shelf-hint">Files → On My iPhone → Pocket Arcade to edit the code. Hold the ↺ button (bottom right) to restore defaults.</div>
      <div id="gameGrid" class="game-grid"></div>
    </div>

    <div id="gameContainer" class="screen hidden"></div>
  </div>

  <script src="games/stardodger.js"></script>
  <script src="games/tictactoe.js"></script>
  <script src="games/connect4.js"></script>
  <script src="games/snake.js"></script>
  <script src="games/twenty48.js"></script>
  <script src="games/memory.js"></script>
  <script src="app.js"></script>
</body>
</html>
